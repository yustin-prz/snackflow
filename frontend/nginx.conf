server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index login.html;

    location / {
        try_files $uri $uri/ /login.html;
        # Sin esto el navegador puede quedarse con una versión vieja de un .js/.css/.html
        # cacheada varios días (heurística por defecto) y los cambios no se ven ni
        # recargando la página — es un proyecto que se redespliega seguido, así que
        # "no-store" (no cachear nada) vale más que ahorrarse el request.
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    location /api {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
